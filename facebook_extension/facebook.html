<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook extension</title>
    <script src="facebook.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            color: #444;
        }

        .controls {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            margin-bottom: 20px;
        }

        label {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 10px;
            display: inline-block;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 15px 0;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 40px;
            padding: 8px;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #fff;
        }

        input[type="color"]::-webkit-color-swatch {
            border-radius: 5px;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            border-radius: 5px;
        }

        br {
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Facebook extension</h1>

    <div class="controls">
        <button id="backgroundColor">Set background color red</button>
    
        <label for="changeLinkColor">Change link color: </label>
        <input type="color" id="changeLinkColor" name="changeLinkColor" value="#ff0000">
    
        <button id="deleteImgs">Delete images</button>
        <button id="hideOrShowPasswords">Show/hide passwords</button>
    </div>
    
</body>
</html>
